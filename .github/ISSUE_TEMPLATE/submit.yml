name: Submit to the RelBench leaderboard
description: Submit your method to the RelBench leaderboard by uploading test set predictions.
title: "[submit] "
labels: ["submit"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in RelBench! Please see [the README](https://github.com/rishabh-ranjan/relbench#submitting-to-the-leaderboard) for how to prepare and validate your submission zip.
  - type: input
    id: method-name
    attributes:
      label: Name
      description: Display name shown on the leaderboard.
      placeholder: My awesome method
    validations:
      required: true
  - type: checkboxes
    id: in-context
    attributes:
      label: In-context
      options:
        - label: I confirm that my method was not trained on the target **database** in any form (leave unchecked if not).
  - type: input
    id: url
    attributes:
      label: URL
      description: Paper / project / code link.
      placeholder: https://arxiv.org/abs/...
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Note
      description: Anything you'd like to add, shown on hover (optional).
  - type: textarea
    id: files
    attributes:
      label: File(s)
      description: Upload the zip file(s) written by `python -m relbench.submit` here.
      placeholder: Paste, drop, or click to add files.
    validations:
      required: true
