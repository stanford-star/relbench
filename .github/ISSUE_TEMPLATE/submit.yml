name: Submit to the RelBench leaderboard
description: Submit your method to the RelBench leaderboard by uploading test set predictions.
title: "[submit] "
labels: ["submit"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting to the RelBench leaderboards! See the
        [submission instructions](https://github.com/rishabh-ranjan/relbench#submitting-to-the-leaderboard)
        in the README for how to prepare and validate your submission zip.
  - type: input
    id: method-name
    attributes:
      label: Method name
      description: Display name shown on the leaderboard.
      placeholder: RelGNN
    validations:
      required: true
  - type: checkboxes
    id: in-context
    attributes:
      label: In-context
      options:
        - label: This method is in-context — no training on the target database.
  - type: input
    id: url
    attributes:
      label: URL
      description: Paper / project / code link (optional).
      placeholder: https://arxiv.org/abs/...
  - type: textarea
    id: note
    attributes:
      label: Note
      description: Caveats or evaluation details, shown on hover (optional).
  - type: textarea
    id: files
    attributes:
      label: Prediction files
      description: Drag your submission zip here (written by `python -m relbench.submit`).
      placeholder: Attach files by dragging them into this text area.
    validations:
      required: true
