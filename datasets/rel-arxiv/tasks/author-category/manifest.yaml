name: author-category
kind: external
task_type: multiclass_classification
description: Predict the primary research category in which an author will publish papers in the next six months.
entity_table: authors
entity_col: Author_ID
target_col: primary_category
time_col: date
timedelta: 182 days
sql: "\n            WITH author_pubs AS (\n                SELECT\n                    t.timestamp AS date,\n                    pa.Author_ID,\n                    p.Primary_Category_ID\n                FROM timestamps t\n                JOIN paperAuthors pa\n                ON pa.Submission_Date > t.timestamp\n                AND pa.Submission_Date <= t.timestamp + INTERVAL '{timedelta}'\n                JOIN papers p\n                ON pa.Paper_ID = p.Paper_ID\n            ),\n            pub_counts AS (\n                SELECT\n                    date,\n                    Author_ID,\n                    Primary_Category_ID,\n                    COUNT(*) AS cnt\n                FROM author_pubs\n                GROUP BY date, Author_ID, Primary_Category_ID\n            ),\n            ranked AS (\n                SELECT\n                    date,\n                    Author_ID,\n                    Primary_Category_ID,\n                    ROW_NUMBER() OVER (PARTITION BY date, Author_ID ORDER BY cnt DESC) AS rn\n                FROM pub_counts\n            )\n            SELECT\n                r.date,\n                r.Author_ID,\n                c.Category AS primary_category\n            FROM ranked r\n            LEFT JOIN categories c ON r.Primary_Category_ID = c.Category_ID\n            WHERE r.rn = 1\n            ;\n            "
manifest_version: 1
