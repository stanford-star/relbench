name: rel-ratebeer
manifest_version: 1
description: 'RateBeer reviews: users, beers, brewers, places, and time-stamped ratings.'
val_timestamp: '2018-09-01'
test_timestamp: '2020-01-01'
tables:
  brewers:
    pkey: brewer_id
    time_col: null
    fkeys:
      country_id: countries
      state_id: states
      type_id: place_types
  beer_styles:
    pkey: style_id
    time_col: null
    fkeys: {}
  beers:
