name: rel-event
manifest_version: 1
description: 'Event recommendation: users, events, attendance records, and social and interest signals.'
val_timestamp: '2012-11-21'
test_timestamp: '2012-11-29'
tables:
  user_friends:
    pkey: null
    time_col: null
    fkeys:
      user: users
      friend: users
  event_interest:
    pkey: null
    time_col: timestamp
    fkeys:
      event: events
      user: users
  event_attendees:
    pkey: null
    time_col: start_time
    fkeys:
      event: events
      user_id: users
  users:
    pkey: user_id
    time_col: joinedAt
    fkeys: {}
  events:
    pkey: event_id
    time_col: start_time
    fkeys:
      user_id: users
