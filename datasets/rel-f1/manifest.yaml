name: rel-f1
manifest_version: 1
description: 'Formula 1 motorsport database: races, drivers, constructors, circuits, race results, qualifying, and championship standings.'
val_timestamp: '2005-01-01'
test_timestamp: '2010-01-01'
tables:
  races:
    pkey: raceId
    time_col: date
    fkeys:
      circuitId: circuits
  qualifying:
    pkey: qualifyId
    time_col: date
    fkeys:
      raceId: races
      driverId: drivers
      constructorId: constructors
  constructor_standings:
    pkey: constructorStandingsId
    time_col: date
    fkeys:
      raceId: races
      constructorId: constructors
  standings:
    pkey: driverStandingsId
    time_col: date
    fkeys:
      raceId: races
      driverId: drivers
  constructors:
    pkey: constructorId
    time_col: null
    fkeys: {}
  drivers:
    pkey: driverId
    time_col: null
    fkeys: {}
  constructor_results:
    pkey: constructorResultsId
    time_col: date
    fkeys:
      raceId: races
      constructorId: constructors
  circuits:
    pkey: circuitId
    time_col: null
    fkeys: {}
  results:
    pkey: resultId
    time_col: date
    fkeys:
      raceId: races
      driverId: drivers
      constructorId: constructors
