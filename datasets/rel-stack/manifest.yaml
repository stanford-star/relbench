name: rel-stack
manifest_version: 1
description: 'Stack Exchange Q&A: users, posts, comments, votes, badges, and post links.'
val_timestamp: '2020-10-01'
test_timestamp: '2021-01-01'
tables:
  badges:
    pkey: Id
    time_col: Date
    fkeys:
      UserId: users
  votes:
    pkey: Id
    time_col: CreationDate
    fkeys:
      PostId: posts
      UserId: users
  users:
    pkey: Id
    time_col: CreationDate
    fkeys: {}
  comments:
    pkey: Id
    time_col: CreationDate
    fkeys:
      UserId: users
      PostId: posts
  posts:
    pkey: Id
    time_col: CreationDate
    fkeys:
      OwnerUserId: users
      ParentId: posts
  postLinks:
    pkey: Id
    time_col: CreationDate
    fkeys:
      PostId: posts
      RelatedPostId: posts
  postHistory:
    pkey: Id
    time_col: CreationDate
    fkeys:
      PostId: posts
      UserId: users
