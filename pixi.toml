[workspace]
authors = ["Rishabh Ranjan <rishabhranjan0207@gmail.com>"]
channels = ["conda-forge"]
name = "relbench"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
uv = "*"
python = "==3.10"

# CPU torch + matching pyg-lib wheels (this dev box and CI have no GPU). For GPU work,
# point torch at a CUDA build and switch find-links to the matching data.pyg.org index,
# e.g. https://data.pyg.org/whl/torch-2.9.0+cu128.html.
[pypi-options]
index-url = "https://pypi.org/simple"
find-links = [{ url = "https://data.pyg.org/whl/torch-2.9.0+cpu.html" }]

[pypi-dependencies]
torch = { version = "==2.9.1", index = "https://download.pytorch.org/whl/cpu" }
pyg-lib = "*"
relbench = { path = ".", editable = true, extras = ["example", "dev"] }

[tasks.test]
cmd = "pytest test"
